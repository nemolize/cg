name: Changeset

on:
  pull_request:
    # Label changes must re-run this check alone, without re-running the build matrix in ci.yml.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  changeset:
    name: changeset
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: nemolize/actions/changeset@5d31663b9013a671ff8fe8b84900a88b9878f0c1 # v1.5.0
